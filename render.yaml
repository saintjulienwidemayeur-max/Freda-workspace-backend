services:
  # API Freda Workspace (recherche et achat de domaines via NameSilo).
  # Les secrets se saisissent dans le tableau de bord Render (sync: false).
  - type: web
    name: freda-workspace-api
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/freda.db
      - key: APP_URL
        value: https://fredaworkspace.com
      - key: API_URL
        value: https://api.fredaworkspace.com
      - key: ALLOWED_ORIGINS
        value: https://fredaworkspace.com
      - key: NAMESILO_MODE
        value: dry-run          # passer à live seulement quand Pay'm est branché et testé
      - key: PAYMENTS_PROVIDER
        value: demo             # interdit avec NAMESILO_MODE=live
      - key: MAILER
        value: brevo
      - key: NAMESILO_API_KEY
        sync: false
      - key: NAMESILO_CONTACT_ID
        sync: false
      - key: NAMESERVERS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PAYM_CLIENT_ID
        sync: false
      - key: PAYM_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PURELYMAIL_API_KEY
        sync: false
      - key: DATA_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
    disk:
      name: api-data
      mountPath: /var/data
      sizeGB: 1
