services:
  # API Freda Workspace (recherche et achat de domaines via NameSilo).
  # Les secrets se saisissent dans le tableau de bord Render (sync: false).
  - type: web
    name: freda-workspace-api
    runtime: node
    plan: starter
    region: virginia        # même zone que la base Supabase (us-east-1) : chaque requête fait plusieurs allers-retours vers la base
    numInstances: 1         # UNE seule instance (observateurs push, limiteurs de débit, tâches périodiques)
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Supabase : URI du « Session pooler » (Project Settings > Database > Connection string), avec le mot de passe
      - key: DATABASE_POOL_MAX
        value: 8
      - key: APP_URL
        value: https://fredaworkspace.com
      - key: API_URL
        value: https://api.fredaworkspace.com
      - key: ALLOWED_ORIGINS
        value: https://fredaworkspace.com,https://www.fredaworkspace.com   # toute origine absente d'ici affiche « Failed to fetch » ; ajoutez l'URL *.onrender.com du site si vous l'utilisez
      - key: NAMESILO_MODE
        sync: false             # live en production (le tableau de bord Render fait foi : une valeur écrite ici écraserait le réglage à chaque synchronisation du blueprint)
      - key: PAYMENTS_PROVIDER
        sync: false             # issuing (MonCash / NatCash + cartes Stripe) ou stripe (cartes seulement) ; « demo » est refusé en production
      - key: TRUSTED_PROXY_HOPS
        value: 1                # Render ajoute 1 proxy : l'IP du client est la dernière entrée de X-Forwarded-For
      - key: MAILER
        value: brevo
      - key: NAMESILO_API_KEY
        sync: false
      - key: NAMESILO_CONTACT_ID
        sync: false
      - key: NAMESERVERS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PAYM_CLIENT_ID
        sync: false
      - key: PAYM_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false          # clé PUBLIQUE pk_live_… (Embedded Checkout) ; jamais la clé secrète
      - key: BREVO_API_KEY
        sync: false
      - key: PURELYMAIL_API_KEY
        sync: false
      - key: DATA_KEY
        generateValue: true     # 32 octets aléatoires, créés une seule fois par Render : copiez-les dans votre gestionnaire de mots de passe
      - key: APNS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false          # Web Push (version web de Freda Mail) : « node scripts/generate-vapid.js » ; la clé publique n'est pas secrète
      - key: VAPID_PRIVATE_KEY
        sync: false          # SECRET : ne jamais la publier
      - key: ALERT_WEBHOOK_URL
        sync: false
