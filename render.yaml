services:
  # API Freda Workspace (recherche et achat de domaines via NameSilo).
  # Les secrets se saisissent dans le tableau de bord Render (sync: false).
  - type: web
    name: freda-workspace-api
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NAMESILO_MODE
        value: dry-run          # passer à live seulement quand Freda Pay est branché
      - key: NAMESILO_API_KEY
        sync: false
      - key: NAMESILO_CONTACT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYMENTS_PROVIDER
        value: demo             # interdit avec NAMESILO_MODE=live
      - key: ALLOWED_ORIGINS
        value: https://fredaworkspace.com
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: api-data
      mountPath: /var/data
      sizeGB: 1
